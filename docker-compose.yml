services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcserver
      POSTGRES_USER: mcserver
      POSTGRES_PASSWORD: mcserver
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcserver -d mcserver"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    env_file: .env
    ports:
      - "5173:80"
    depends_on:
      - backend

  discord-bot:
    build: ./discord-bot
    env_file: .env
    depends_on:
      - backend
    profiles:
      - discord

volumes:
  postgres-data:

